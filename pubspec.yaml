name: graduation_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: 10.1.0
  dio: ^5.4.3  
  intl: ^0.19.0  
  cupertino_icons: ^1.0.6
  dotted_border: ^2.1.0 
  image_picker: ^1.0.7
  camera: ^0.11.0
  path_provider: ^2.1.0
  path: ^1.9.0
  barcode_widget: ^2.0.4
  shared_preferences: ^2.2.2
  share_plus: ^10.1.0
  screenshot: ^3.0.0
  image_gallery_saver: ^2.0.3
  adaptive_theme: ^3.4.0
  google_maps_flutter: ^2.9.0
  uuid: ^4.5.1
  http: ^1.4.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.7.0
  permission_handler: ^11.0.0  # ✅ إضافة
  image: ^4.1.3
  device_info_plus: ^10.1.0
dependency_overrides:
  camera_android_camerax: 0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700